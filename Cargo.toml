[package]
name = "herdr-agent-watcher"
version = "0.1.3"
description = "Coding-agent observability plugin for herdr: transcript watchers, metrics, and notifications for Claude Code, Codex, Kimi Code, and OpenCode."
license = "Apache-2.0"
edition = "2021"
rust-version = "1.88"

[lib]
name = "herdr_agent_watcher"
path = "src/lib.rs"

[features]
default = ["runtime"]
e2e-test = []
runtime = [
  "dep:libc", "dep:ratatui", "dep:crossterm", "dep:tokio", "dep:tokio-util",
  "dep:notify", "dep:rusqlite", "dep:ureq", "dep:portable-pty", "dep:shell-words",
  "dep:regex", "dep:once_cell", "dep:env_logger", "dep:dirs", "dep:sha2",
  "dep:tempfile",
]

[[bin]]
name = "herdr-agent-watcher"
path = "src/main.rs"
required-features = ["runtime"]

[dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
portable-pty = { version = "0.8", optional = true }
thiserror = "2.0"
log = "0.4"
tokio = { version = "1", features = ["sync", "io-util", "io-std", "time", "rt", "rt-multi-thread", "macros", "process"], optional = true }
tokio-util = { version = "0.7", features = ["rt"], optional = true }
notify = { version = "6", optional = true }
tempfile = { version = "3", optional = true }
chrono = "0.4"
shell-words = { version = "1.1", optional = true }
regex = { version = "1.10", optional = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
sha2 = { version = "0.10", optional = true }
once_cell = { version = "1.19", optional = true }
env_logger = { version = "=0.11.5", optional = true }
dirs = { version = "6", optional = true }
ureq = { version = "2", optional = true }
toml = "0.8"
libc = { version = "0.2", optional = true }
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"], optional = true }
crossterm = { version = "0.29", optional = true }
unicode-width = "0.2"

[dev-dependencies]
ts-rs = "10"
tempfile = "3"
