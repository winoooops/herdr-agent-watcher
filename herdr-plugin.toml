id = "herdr-agent-watcher"
name = "Agent Watcher"
version = "0.2.2"
min_herdr_version = "0.8.0"
description = "Coding-agent observability: transcript watchers, metrics, and notifications for Claude Code, Codex, Kimi Code, and OpenCode."
platforms = ["macos", "linux"]

[[build]]
# Not a compile step by contract — it only has to leave a working binary at
# target/release/herdr-agent-watcher. It fetches a verified release asset when
# one matches the platform and compiles when anything goes wrong.
command = ["sh", "scripts/fetch-or-build.sh"]
platforms = ["macos", "linux"]

[[startup]]
command = ["target/release/herdr-agent-watcher", "daemon"]

[[panes]]
id = "sidebar"
title = "Agent Watcher"
description = "Live coding-agent observability cards"
placement = "split"
command = ["/bin/sh", "-lc", "exec \"$HERDR_PLUGIN_ROOT/target/release/herdr-agent-watcher\" sidebar"]

[[actions]]
id = "restart-daemon"
title = "Start or restart the agents daemon"
command = ["target/release/herdr-agent-watcher", "daemon"]

[[actions]]
id = "stop-daemon"
title = "Stop the agents daemon"
command = ["target/release/herdr-agent-watcher", "stop"]

[[actions]]
id = "open-sidebar"
title = "Open the Agent Watcher sidebar (each invoke opens a new split)"
command = ["target/release/herdr-agent-watcher", "sidebar-open"]

[[actions]]
id = "enable-claude-bridge"
title = "Enable Claude metrics (writes to your Claude settings)"
command = ["target/release/herdr-agent-watcher", "enable-claude-bridge"]

[[actions]]
id = "disable-claude-bridge"
title = "Disable Claude metrics and restore your settings"
command = ["target/release/herdr-agent-watcher", "disable-claude-bridge"]

[[actions]]
id = "doctor"
title = "Diagnose the Claude metrics bridge"
command = ["target/release/herdr-agent-watcher", "doctor"]

[[actions]]
id = "bind-sidebar-key"
title = "Bind a key to open the sidebar (writes to Herdr's config)"
command = ["target/release/herdr-agent-watcher", "bind-sidebar-key"]

[[actions]]
id = "unbind-sidebar-key"
title = "Remove the sidebar keybinding from Herdr's config"
command = ["target/release/herdr-agent-watcher", "unbind-sidebar-key"]

[[actions]]
id = "kimi-consent-on"
title = "Enable Kimi usage reporting consent"
command = ["target/release/herdr-agent-watcher", "kimi-consent", "on"]

[[actions]]
id = "kimi-consent-off"
title = "Disable Kimi usage reporting consent"
command = ["target/release/herdr-agent-watcher", "kimi-consent", "off"]

[[actions]]
id = "kimi-consent-status"
title = "Show Kimi usage reporting consent"
command = ["target/release/herdr-agent-watcher", "kimi-consent", "status"]
